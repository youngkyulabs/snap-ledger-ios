# SnapLedger SwiftLint configuration.
# Strict mode (warnings -> build errors). Korean string literals and SwiftUI
# modifier chains drive the relaxations below.

included:
  - SnapLedger
  - SnapLedgerShareExtension
  - SnapLedgerTests
  - SnapLedgerUITests

excluded:
  - .build
  - DerivedData
  - build
  - "**/*.generated.swift"

disabled_rules:
  # SwiftUI uses multi-trailing-closure DSL pervasively
  # (Section{}header:{}footer:{}, ToolbarItem{}label:{}, Button{}label:{}).
  - multiple_closures_with_trailing_closure

# Test files use `!` everywhere for setup ("if this fails, fail the test loudly").
# Allow file-level `swiftlint:disable force_unwrapping` for that case.
blanket_disable_command:
  allowed_rules:
    - force_unwrapping

line_length:
  # 160 accommodates Korean @Guide(description:) prompts in PaymentExtraction.swift
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

identifier_name:
  min_length:
    warning: 1
    error: 0
  max_length:
    warning: 60
    error: 80
  excluded: [id, to, at, in, of, on]

type_name:
  min_length: { warning: 3, error: 0 }
  max_length: { warning: 50, error: 60 }

trailing_comma:
  mandatory_comma: true

function_body_length: { warning: 80,  error: 150 }
type_body_length:     { warning: 350, error: 500 }
file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true
cyclomatic_complexity: { warning: 12, error: 20 }

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

reporter: "emoji"
