name: 기능 제안
description: 새 기능이나 개선 아이디어를 제안합니다.
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 어떤 기능을 제안하시나요?
      description: 무엇을, 어떻게 동작하면 좋을지 자유롭게 적어주세요.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 왜 필요한가요?
      description: 어떤 상황에서 유용한지, 지금은 어떻게 해결하고 있는지.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 검토해본 대안 (선택)
      description: 비슷한 기능을 제공하는 다른 방법이나 앱이 있다면.
    validations:
      required: false
