name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint and xcbeautify
        run: |
          brew list swiftlint &>/dev/null || brew install swiftlint
          brew list xcbeautify &>/dev/null || brew install xcbeautify
          swiftlint version

      - name: SwiftLint (strict)
        run: swiftlint --strict --config .swiftlint.yml

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SnapLedger.xcodeproj \
            -scheme SnapLedger \
            -destination 'generic/platform=iOS Simulator' \
            build \
            | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SnapLedger.xcodeproj \
            -scheme SnapLedger \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:SnapLedgerTests \
            | xcbeautify --renderer github-actions

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: actionlint
        env:
          # Pinned like fastlane in release.yml. A linter whose rules shift under
          # you is worse than none, and the checksum comes from the release's own
          # checksums.txt.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
          # The runner ships shellcheck, so `run:` blocks get checked too --
          # something a local run without it cannot do. (Do not start this
          # comment with the tool's name: that spelling is a shellcheck
          # directive, and it fails to parse as one.)
          ./actionlint -color
