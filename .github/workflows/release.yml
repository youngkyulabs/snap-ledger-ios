name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # One release at a time for the whole app, not one per tag: App Store Connect
  # keeps a single editable draft, so two tags in flight would fight over it.
  group: app-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Metadata · Screenshots · Build link
    runs-on: ubuntu-latest
    # Must stay comfortably above the link-build budget below (15 + 75 = 90 min)
    # plus setup, so a slow-but-healthy Xcode Cloud build ends in the script's
    # own error rather than a bare "job cancelled" with metadata already sent.
    timeout-minutes: 120
    outputs:
      delivered: ${{ steps.deliver.outputs.delivered }}

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TAG_WORKFLOW_ID: ${{ vars.XCODE_CLOUD_TAG_WORKFLOW_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history and every branch, so the tag can be proven to sit on main.
          fetch-depth: 0

      - name: Resolve the tagged commit
        run: |
          # GITHUB_SHA is the tag object's SHA for an annotated tag, which would
          # never match Xcode Cloud's sourceCommit. Dereference to the commit.
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          echo "TAG_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "${GITHUB_REF_NAME} -> $sha"

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${TAG_COMMIT}) is not on main; refusing to release"
            exit 1
          fi

      - name: Point credentials at the runner temp dir
        run: |
          # Set here rather than in the job's `env`: the `runner` context is
          # unavailable at that level, and referencing it there makes the whole
          # workflow file invalid. $RUNNER_TEMP is outside the checkout.
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_JSON=$RUNNER_TEMP/asc_key.json" >> "$GITHUB_ENV"

      - name: Restore ASC private key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      - name: Preflight (blocks before anything is uploaded)
        run: |
          python3 -m scripts.asc_release preflight \
            --tag "${GITHUB_REF_NAME}" \
            --workflow-id "${TAG_WORKFLOW_ID}"

      - name: Stage screenshots
        run: ./scripts/stage_screenshots.sh

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N -v 2.240.1

      - name: Build ASC API key JSON for fastlane
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ["ASC_KEY_PATH"], encoding="utf-8") as handle:
              key = handle.read()
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": key,
              "in_house": False,
          }
          with open(os.environ["ASC_KEY_JSON"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          chmod 600 "$ASC_KEY_JSON"

      - name: Upload metadata and screenshots
        id: deliver
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          set -euo pipefail
          fastlane deliver \
            --api_key_path "$ASC_KEY_JSON" \
            --app_identifier com.youngkyu.snapledger \
            --app_version "${GITHUB_REF_NAME#v}" \
            --metadata_path ./fastlane/metadata \
            --screenshots_path ./fastlane/screenshots \
            --overwrite_screenshots true \
            --skip_binary_upload true \
            --submit_for_review false \
            --precheck_include_in_app_purchases false \
            --force
          echo "delivered=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the Xcode Cloud build and link it
        run: |
          python3 -m scripts.asc_release link-build \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${TAG_COMMIT}" \
            --workflow-id "${TAG_WORKFLOW_ID}" \
            --run-timeout 900 \
            --timeout 4500

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/asc_key.json"

  bump:
    name: Next version PR
    # Once deliver has run the version is committed, even if link-build fails
    # afterwards. A tag that failed before that is spent, and the next version
    # is then a manual patch decision.
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.delivered == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # main may have moved past the tagged commit; branching from the tag
          # would conflict with whatever landed since.
          ref: main

      - name: Move MARKETING_VERSION past the release
        id: bump
        run: |
          set -euo pipefail
          next=$(python3 -m scripts.version_bump --tag "${GITHUB_REF_NAME}")
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Open the bump PR
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # Keyed on the tag, which is never reused: a re-run finds its own branch
          # and PR, and a patch release (same next version) gets a new one.
          branch="chore/bump-after-${GITHUB_REF_NAME}"
          remote=0
          git ls-remote --exit-code origin "refs/heads/${branch}" > /dev/null || remote=$?
          if [ "$remote" -eq 2 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git commit -am "chore: bump version to ${NEXT_VERSION}"
            git push origin "$branch"
          elif [ "$remote" -ne 0 ]; then
            exit "$remote"
          fi
          # --head also matches fork PRs that use the same branch name.
          existing=$(gh pr list --head "$branch" --state all --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .number')
          if [ -n "$existing" ]; then
            echo "${branch} already has PR ${existing}"
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "chore: 버전 ${NEXT_VERSION} 상향" \
            --body-file - <<EOF
          ## 작업 내용

          \`${GITHUB_REF_NAME}\` 릴리즈 후속으로 \`MARKETING_VERSION\`을 올립니다 (\`${GITHUB_REF_NAME#v}\` → \`${NEXT_VERSION}\`). Release 워크플로가 자동으로 연 PR입니다.

          ## 평가

          App Store Connect는 마지막으로 승인된 버전보다 높은 버전의 빌드만 받습니다. \`${GITHUB_REF_NAME}\` 승인 뒤에는 이 PR을 머지하기 전까지 main push의 TestFlight 빌드가 실패합니다.

          ## 알려진 한계/리스크

          - \`${GITHUB_REF_NAME}\` 승인 직후에 머지하세요. 그 전에 머지하면 심사 중인 바이너리가 리젝됐을 때 main에서 같은 버전으로 다시 빌드할 수 없습니다.
          - 다음 릴리즈를 패치나 메이저로 낼 거라면 머지 전에 이 브랜치에서 버전을 고치세요.

          ## 검증

          - 워크플로 토큰으로 연 PR이라 CI가 승인 대기 상태로 만들어집니다. PR의 **Approve workflows to run**을 눌러 실행하세요.
          EOF
